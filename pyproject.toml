[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "work2-federated-workflow"
version = "0.1.0"
description = "Federated poisoning workflow examples, data preparation, and observation analysis"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
work2 = "work2.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
